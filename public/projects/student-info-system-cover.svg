<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- subtle dot grid texture -->
  <g fill="#ffffff" opacity="0.03">
    <circle cx="1080" cy="60" r="2"/><circle cx="1120" cy="60" r="2"/><circle cx="1160" cy="60" r="2"/>
    <circle cx="1080" cy="100" r="2"/><circle cx="1120" cy="100" r="2"/><circle cx="1160" cy="100" r="2"/>
    <circle cx="1080" cy="140" r="2"/><circle cx="1120" cy="140" r="2"/><circle cx="1160" cy="140" r="2"/>
  </g>

  <!-- browser chrome dots, matches terminal aesthetic -->
  <circle cx="60" cy="61" r="9" fill="#ff5f56"/>
  <circle cx="90" cy="61" r="9" fill="#ffbd2e"/>
  <circle cx="120" cy="61" r="9" fill="#27c93f"/>

  <!-- title block -->
  <text x="60" y="150" font-family="JetBrains Mono, Fira Code, monospace" font-size="52" font-weight="700" fill="#ffffff">CampusConnect</text>
  <text x="60" y="192" font-family="Inter, sans-serif" font-size="22" fill="#94a3b8">Student Information Management System</text>
  <text x="60" y="228" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" fill="#cbd5e1">Spring Boot · PostgreSQL · React.js</text>

  <!-- mock UI: add student button -->
  <rect x="60" y="256" width="176" height="46" rx="23" fill="url(#btn)"/>
  <text x="148" y="285" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add student</text>

  <!-- mock UI: record list skeleton -->
  <rect x="60" y="330" width="540" height="14" rx="7" fill="#ffffff" opacity="0.08"/>
  <rect x="60" y="364" width="420" height="14" rx="7" fill="#ffffff" opacity="0.08"/>
  <rect x="60" y="398" width="340" height="14" rx="7" fill="#ffffff" opacity="0.08"/>

  <!-- decorative right-side panel -->
  <rect x="760" y="220" width="380" height="200" rx="16" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="790" y="260" font-family="JetBrains Mono, Fira Code, monospace" font-size="14" fill="#7c8aa5" letter-spacing="2">RECORD DETAIL</text>
  <rect x="790" y="284" width="320" height="10" rx="5" fill="#ffffff" opacity="0.10"/>
  <rect x="790" y="308" width="260" height="10" rx="5" fill="#ffffff" opacity="0.10"/>
  <rect x="790" y="332" width="290" height="10" rx="5" fill="#ffffff" opacity="0.10"/>
  <rect x="790" y="368" width="100" height="32" rx="16" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="840" y="389" font-family="Inter, sans-serif" font-size="13" fill="#4ade80" text-anchor="middle">Active</text>
</svg>
